services:
  backend:
    build:
      context: ./cloud/backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_ENGINE: postgres
      DB_HOST: smartassert-db.cf62ge0e2yp1.ap-south-1.rds.amazonaws.com
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-smartadmin}
      DB_SSL: "true"
      STORAGE_PROVIDER: s3
      S3_BUCKET_NAME: cc.bills
      AWS_REGION: ap-south-1
      CORS_ORIGIN: http://52.66.240.88
      COOKIE_SAMESITE: lax
      GCS_ENABLED: "false"
      GCS_MAX_UPLOAD_BYTES: 15728640
    restart: unless-stopped
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./cloud/frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
